# Phase 4 流水线参数。任务 9 的离线扫参就是在这些键上做网格搜索。

tracker:
  high_thresh: 0.5        # 高分检测直接参与一级关联
  low_thresh: 0.1         # 低分检测只用于二级关联，救回糊帧
  match_thresh: 0.7
  match_thresh_low: 0.4
  fallback_match_thresh: 0.3   # GMC 失败时放宽门限，宁可松也不要断轨
  track_buffer: 30        # 丢失后保留帧数（转头回来还能接上）
  min_hits: 2
  smooth_alpha: 0.8       # 观测主导：牌是静止的，别让滤波器凭空造速度
  gmc_enabled: true
  # 外观约束：关联时除了看框重叠，再看两者的分类概率分布像不像。
  # 密集排列的牌框大量重叠，纯 IoU 分不清谁是谁——这是闪烁的根因。
  # 实测(3 段片段，其他参数不变)：闪烁 0.1048 -> 0.0197，准确率 95.62% -> 95.97%。
  # 代价是 ID 切换 19.8% -> 23.1%：接错人变成了不接，而"多一个新 ID"
  # 比"同一张牌突然变成另一张"危害小，且能被"每种牌只有 4 张"的规则兜住。
  appearance_weight: 0.3
  appearance_momentum: 0.7

voter:
  window: 7
  min_conf: 0.5           # 低于此值视为弃权，不入窗
  min_effective: 3
  majority_ratio: 0.6
  hysteresis: 4           # 连续 4 次才允许推翻已确认类别
  full_weight_px: 40      # 短边 >= 此值的 crop 给满权重

state:
  occluded_after: 2        # 丢 2 帧标记为"被遮挡"，但仍保留在输出中
  # 麻将牌放下就不动了：真正离场只有碰杠取牌和一局结束。原来 30 帧(stride 3 下约 3 秒)
  # 会把被手挡住的牌整个删掉，回来时变成新 ID、从头投票——既涨 ID 切换又涨确认延迟。
  lost_after: 300
  emit_frame_summary: true

zones:
  # 参数来自 899 个人工标注框、图级 5 折交叉验证。
  # 演进: 88.9%(位置+尺寸) -> 93.6%(+疏密) -> 94.5%(+簇内投票)
  # 逐区域: 手牌 100 / 牌池 97.2 / 下家 97.8 / 上家 85.7 / 对家 71.0
  enabled: true
  hand_size_ratio: 1.4        # 手牌: 尺寸 >= 帧内中位数的 1.4 倍
  hand_min_ny: 0.55           #       且在画面下方 55% 以下
  left_max_nx: 0.30           # 上家: 靠左
  left_max_nn: 0.45           #       且成簇(侧面看牌框大幅重叠)
  right_min_nx: 0.78          # 下家: 靠右
  across_max_ny: 0.28         # 对家: 靠上
  across_min_nn: 0.55         #       且相对孤立——牌池是密集的
  cluster_link: 1.2           # 簇内平滑: 中心距 < 1.2 倍平均宽度算同一簇
  cluster_max_frac: 0.35      #   超过全帧 35% 的大簇是牌池本身，跨区域，不平滑
